function tone(time,freq,length,vol,type='sine',bus=fx){if(!audio||!bus||audio.state!=='running')return;let at=audio.currentTime+Math.max(.005,(time-performance.now())/1000);let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+length);o.connect(g);g.connect(bus);o.start(at);o.stop(at+length+.02)}
const bass=[82,82,110,123,82,92,123,110,92,92,110,139,92,82,123,110];
function musicStep(t,n){if(!bgmOn)return;let eighth=n%2,quarter=Math.floor(n/2);if(!eighth){tone(t,55,.22,.65,'sine',music);if(quarter%4===1||quarter%4===3)tone(t,440,.055,.09,'square',music)}else{tone(t,5800,.03,.045,'triangle',music);tone(t,bass[((n%16)+16)%16],.18,.19,'sawtooth',music)}if(n%8===5)tone(t,330,.09,.05,'triangle',music)}
function schedule(t){if(!audio||audio.state!=='running')return;let limit=t+140,k=0;while(timeOf(nextHalfAudio*.5)<limit&&k++<16){let at=timeOf(nextHalfAudio*.5);if(at>=t-45)musicStep(at,nextHalfAudio);nextHalfAudio++}k=0;while(nextCue<cues.length&&timeOf(cues[nextCue].beat)<limit&&k++<20){let c=cues[nextCue++],at=timeOf(c.beat);if(at>=t-50){tone(at,1450,.10,.28,'square');tone(at+80,2050,.05,.07,'triangle')}}}
function feedback(text,color){$('#p7judgment').textContent=text;$('#p7judgment').style.color=color;toastEnd=performance.now()+390}
function tap(){if(!onScreen())return;let t=performance.now(),e=null,dist=210;for(let x of notes){if(x.status!=='wait')continue;let d=Math.abs(t-timeOf(x.beat));if(d<dist){dist=d;e=x}}pressedUntil=t+180;if(!e){feedback('TOO EARLY','#ff9aac');return}e.status='hit';counter[e.id]++;hitCount++;combo++;maxCombo=Math.max(maxCombo,combo);let rating=dist<75?'PERFECT':dist<135?'GREAT':'GOOD';let points=(e.fast?180:100)+(rating==='PERFECT'?100:rating==='GREAT'?50:0)+Math.min(100,combo*2);score+=points;save();feedback(rating+' +'+points,rating==='PERFECT'?'#ffe3a0':'#81eee7');tone(t,810,.09,.15,'triangle')}
function miss(t){for(let e of notes){if(e.status==='wait'&&t>timeOf(e.beat)+210){e.status='miss';combo=0;leaks++;feedback('🔓 LEAK!','#ff819c');tone(t,155,.17,.22,'sawtooth');if(leaks>=3){finish();return}}}}
function save(){if(score>best){best=score;try{localStorage.setItem('priv7-best',best)}catch(e){}}}
function finish(){mode='end';save();$('#p7title').textContent='🔓 情報漏洩！';$('#p7description').textContent='SCORE '+score+' / 撃退 '+hitCount+'体 / 最大コンボ '+maxCombo;$('#p7results').innerHTML=NAMES.map((n,i)=>'<div>'+n+' ×'+counter[i]+'</div>').join('');$('#p7results').hidden=false;$('#p7share').hidden=false;$('#p7start').textContent='↻ もう一度';$('#p7screen').hidden=false}
function start(){unlock();mode='play';bt.length=1;bt[0]=0;startTime=performance.now()+1300;nextBlock=0;nextHalfAudio=0;nextCue=0;currentBeat=-1;hitCount=score=combo=maxCombo=leaks=0;notes.length=cues.length=0;counter.fill(0);$('#p7results').hidden=true;$('#p7share').hidden=true;$('#p7screen').hidden=true;ensure(startTime);updateHud(startTime)}
function pause(){if(mode!=='play')return;mode='pause';pauseAt=performance.now();$('#p7title').textContent='⏸ 一時停止';$('#p7description').textContent='準備ができたら再開！';$('#p7results').hidden=true;$('#p7start').textContent='▶ 再開';$('#p7share').hidden=true;$('#p7screen').hidden=false;if(music&&audio)music.gain.setTargetAtTime(0,audio.currentTime,.02)}
function resume(){if(mode!=='pause')return;let shift=performance.now()-pauseAt;startTime+=shift;mode='play';$('#p7screen').hidden=true;if(music&&audio)music.gain.setTargetAtTime(bgmOn?.7:0,audio.currentTime,.02)}
function draw(t){let w=arena.clientWidth,h=arena.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);if(C.width!==Math.floor(w*dpr)||C.height!==Math.floor(h*dpr)){C.width=Math.floor(w*dpr);C.height=Math.floor(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let center=w/2,far=44,near=h*.77;
const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0a294b');bg.addColorStop(1,'#06111f');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#133b5670';ctx.beginPath();ctx.moveTo(center-19,far);ctx.lineTo(center+19,far);ctx.lineTo(w*.94,h);ctx.lineTo(w*.06,h);ctx.closePath();ctx.fill();
ctx.strokeStyle='#356484';ctx.lineWidth=1.5;for(let i=0;i<3;i++){let x=center+(i-1)*30;ctx.beginPath();ctx.moveTo(x,far);ctx.lineTo(center+(i-1)*w*.33,h);ctx.stroke()}
for(let i=0;i<7;i++){let p=i/6,y=far+(near-far)*p*p;ctx.strokeStyle='#34607e77';ctx.beginPath();ctx.moveTo(center-w*(.06+.37*p),y);ctx.lineTo(center+w*(.06+.37*p),y);ctx.stroke()}
ctx.strokeStyle='#65f6ea';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(center,near,w*.235,18,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#54e7e519';ctx.fillRect(center-w*.235,near-10,w*.47,20);ctx.font='28px system-ui';ctx.textAlign='center';ctx.fillText('🛡️',center,near+45);
const visible=notes.filter(n=>n.status==='wait'&&timeOf(n.beat)>t-230&&timeOf(n.beat)<t+2100).sort((a,b)=>timeOf(b.beat)-timeOf(a.beat));for(let n of visible){let p=1-(timeOf(n.beat)-t)/1800;p=Math.min(1.08,Math.max(0,p));if(p===0)continue;let y=far+(near-far)*p*p,size=22+67*p,idx=n.id;ctx.save();if(n.fast){ctx.shadowBlur=15;ctx.shadowColor='#ffcf70';ctx.strokeStyle='#ffac45';ctx.lineWidth=3;ctx.strokeRect(center-size*.54,y-size*.54,size*1.08,size*1.08)}if(atlas.complete&&atlas.naturalWidth){ctx.drawImage(atlas,(idx%5)*56,Math.floor(idx/5)*56,56,56,center-size/2,y-size/2,size,size)}else{ctx.font=size*.65+'px system-ui';ctx.fillText(n.fast?'🐕':'🦠',center,y)}ctx.restore()}
let warning=cues.some(c=>{let elapsed=t-timeOf(c.beat);return elapsed>=-180&&elapsed<350});if(warning){ctx.fillStyle='#ffbd4e';ctx.font='38px system-ui';ctx.fillText('⚠️',center+Math.min(100,w*.30),58)}if(t<pressedUntil){ctx.strokeStyle='#fff5bd';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(center,near,w*.27,23,0,0,Math.PI*2);ctx.stroke()}
}
function frame(t){if(mode==='play'){ensure(t);schedule(t);miss(t);let b=0;while(timeOf(b)<=t&&b<1000)b++;let q=b-1;if(q!==currentBeat){currentBeat=q;$('.dots').querySelectorAll('i').forEach((el,i)=>el.classList.toggle('active',q>=0&&i===q%4))}$('#p7message').textContent=cues.some(c=>t>=timeOf(c.beat)-200&&t<timeOf(c.beat)+900)?'⚠️ 高速接近！':'拍に合わせて防御！';updateHud(t)}if(mode==='play')draw(t);else if(mode==='ready')draw(0);if(t>toastEnd)$('#p7judgment').textContent='';requestAnimationFrame(frame)}
$('#p7start').addEventListener('click',()=>{mode==='pause'?resume():start()});$('#p7pause').addEventListener('click',()=>mode==='play'?pause():mode==='pause'?resume():null);
$('#p7tap').addEventListener('pointerdown',e=>{e.preventDefault();tap()});C.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
$('#p7bgm').addEventListener('click',()=>{bgmOn=!bgmOn;$('#p7bgm').textContent='🎵 BGM '+(bgmOn?'ON':'OFF');if(music&&audio)music.gain.setTargetAtTime(bgmOn?.7:0,audio.currentTime,.02)});
$('#p7fx').addEventListener('click',()=>{fxOn=!fxOn;$('#p7fx').textContent='🔔 SE '+(fxOn?'ON':'OFF');if(fx&&audio)fx.gain.setTargetAtTime(fxOn?1:0,audio.currentTime,.02)});
$('#p7share').addEventListener('click',()=>{const s='🛡️ 漏らすな！個人情報！ '+score+'点！ '+hitCount+'体撃退\nhttps://sectorlab-jp.github.io/morasu-na/\n#漏らすな個人情報';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(s),'_blank','noopener,noreferrer')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
try{requestAnimationFrame(frame)}catch(e){$('#p7description').textContent='この画面ではゲーム機能を実行できないみたい。ブラウザで遊んでね。'}
})();
</script>
